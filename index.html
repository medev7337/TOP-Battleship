<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dumbleship</title>
    <link rel="icon" type="image/png" href="./dumbleshipicon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Play against the Dumbleship (He's not dumb btw)</h1>
      <p id="detailsText">Place your ships</p>
    </header>
    <main>
      <div id="placementBoard">
        <div id="playerBoard" class="board"></div>

        <div id="placementButtons">
          <button id="rotateButton">Rotate</button>
          <button id="clearButton">Clear</button>
          <button id="submitButton">Submit</button>
        </div>
      </div>
    </main>
    <button id="restartButton" style="display: none">Restart</button>

    <script type="module" src="./src/GameLoop.js"></script>
    <script type="module" src="./src/Placement.js"></script>
  </body>
</html>
